[package]
name = "qmsg-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
chacha20poly1305 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
keyring-core = "1.0"
qmsg-types.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = "1.0"
tokio = { version = "1.53", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "49"
wasmtime-wasi = "49"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
