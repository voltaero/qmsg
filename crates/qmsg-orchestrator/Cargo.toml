[package]
name = "qmsg-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", default-features = false }
chacha20poly1305 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
keyring-core = "1.0"
prost = "0.14"
qmsg-types.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = "1.0"
schemars = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-web = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "49"
wasmtime-wasi = "49"
rcgen = "0.14"
rustls-pemfile = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
